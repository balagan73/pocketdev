# pocket-dev — OpenClaw with pluggable stacks and extensions.
#
# First run:
#   ./setup.sh                         # interactive wizard, writes pocketdev.yaml
#   ./rebuild.sh                       # builds and starts the container
#   docker compose logs openclaw       # copy the printed gateway token
#
# To change stacks/extensions later:
#   ./setup.sh  (or edit pocketdev.yaml manually)
#   ./rebuild.sh

services:
  openclaw:
    build:
      context: .
      dockerfile: .openclaw/Dockerfile
    container_name: pocketdev
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/oc-init/entrypoint.sh"]
    env_file:
      # Generated by rebuild.sh from the selected stacks' env.sh files
      # (FLUTTER_HOME, ANDROID_SDK_ROOT, PATH, etc). Optional so a plain
      # `docker compose up` still works before the first rebuild.sh run.
      - path: ./.openclaw/pocketdev-stacks.env
        required: false
    environment:
      - OPENCLAW_SKIP_ONBOARDING=true
      - OPENCLAW_CONFIG_DIR=/home/node/.openclaw
      - OPENCLAW_WORKSPACE_DIR=/workspace
      # Keeps `gh auth login` state under the already-persisted data volume
      # so it survives container restarts and rebuilds.
      - GH_CONFIG_DIR=/home/node/.openclaw/gh
      # Block commits to main/master from inside this container only.
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=core.hookspath
      - GIT_CONFIG_VALUE_0=.githooks
      # Optional discord-voice overrides, read by its install.sh at container
      # start (empty = use extensions/discord-voice/config.yaml, whose default
      # is stt-tts). E.g. `DISCORD_VOICE_MODE=bidi ./rebuild.sh` opts into
      # realtime voice.
      - DISCORD_VOICE_MODE=${DISCORD_VOICE_MODE:-}
      - REALTIME_PROVIDER=${REALTIME_PROVIDER:-}
      - REALTIME_MODEL=${REALTIME_MODEL:-}
      - REALTIME_VOICE=${REALTIME_VOICE:-}
    volumes:
      - .:/workspace
      - ./.openclaw/data:/home/node/.openclaw
      - ./.openclaw/entrypoint.sh:/oc-init/entrypoint.sh:ro
      - ${HOME}/.claude:/home/node/.claude
      - /tmp/openclaw-restart:/run/restart-helper
