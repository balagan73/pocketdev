# Optional overlay: adds Prometheus + Grafana for per-agent usage dashboards.
# Requires the `usage-metrics` extension selected in pocketdev.yaml (it
# writes the token file mounted below) and the base `openclaw` service
# already running.
#
# Bring up together with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: pocketdev-prometheus
    restart: unless-stopped
    # Port 9090 is mapped to the host for verification and local access; Grafana (Task 3)
    # will access Prometheus over the compose network at http://prometheus:9090.
    ports:
      - "9090:9090"
    volumes:
      - ./extensions/usage-metrics/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.openclaw/data/prometheus-scrape-token:/etc/prometheus/openclaw-token:ro
      - prometheus-data:/prometheus
    depends_on:
      - openclaw

  grafana:
    image: grafana/grafana:11.3.0
    container_name: pocketdev-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./extensions/usage-metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./extensions/usage-metrics/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
